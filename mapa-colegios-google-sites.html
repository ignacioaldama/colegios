<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colegios de la Comunidad de Madrid</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    crossorigin=""
  >
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    crossorigin=""
  >
  <style>
    :root {
      --bg: #eef1f4;
      --panel: rgba(255, 255, 255, 0.94);
      --ink: #1f2933;
      --muted: #5b6875;
      --accent: #2f5d62;
      --border: rgba(31, 41, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(47, 93, 98, 0.08), transparent 28%),
        linear-gradient(180deg, #f7f9fb 0%, var(--bg) 100%);
    }

    .layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr;
    }

    .panel {
      padding: 24px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .intro-block {
      padding: 24px 24px 16px;
      background: var(--panel);
    }

    .filtros {
      padding: 0 24px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .leyenda {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .leyenda-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .leyenda-punto {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .chips-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .titularidad-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1.5px solid transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip-icon {
      font-size: 15px;
    }

    .chip--publico {
      background: #eef8f1;
      color: #1b7f3b;
      border-color: #bfe6cc;
    }

    .chip--concertado {
      background: #eaf2fc;
      color: #1c5fb0;
      border-color: #c3daf5;
    }

    .chip--privado {
      background: #fdf3e8;
      color: #c76a12;
      border-color: #f6d9b4;
    }

    .chip.active {
      color: #fff;
      box-shadow: 0 4px 12px rgba(31, 41, 51, 0.18);
    }

    .chip--publico.active { background: #33a457; border-color: #33a457; }
    .chip--concertado.active { background: #3d84d6; border-color: #3d84d6; }
    .chip--privado.active { background: #f0932b; border-color: #f0932b; }

    .info-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--accent);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .info-btn:hover {
      background: #f3f5f7;
    }

    .info-icon {
      font-size: 15px;
      font-weight: 700;
    }

    .tit-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .tit-badge--publico { background: #dff1e6; color: #1b7f3b; }
    .tit-badge--concertado { background: #deebfa; color: #1c5fb0; }
    .tit-badge--privado { background: #fbe8d3; color: #c76a12; }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1;
      font-weight: 700;
    }

    .intro {
      margin: 16px 0 18px;
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
    }

    .status {
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f3f5f7;
      font-size: 14px;
      color: var(--muted);
    }

    .toolbar {
      display: grid;
      gap: 10px;
      margin: 0 0 18px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .reset-btn {
      justify-self: start;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--accent);
      font: inherit;
      cursor: pointer;
    }

    .reset-btn:hover {
      background: #f3f5f7;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      box-shadow: inset 0 1px 2px rgba(31, 41, 51, 0.04);
    }

    .search-input::placeholder {
      color: #75808a;
    }

    .results-meta {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .card {
      padding: 14px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(31, 41, 51, 0.06);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(31, 41, 51, 0.14);
      outline: none;
    }

    .card--publico {
      background: #eef8f1;
      border-left: 5px solid #33a457;
    }

    .card--concertado {
      background: #eaf2fc;
      border-left: 5px solid #3d84d6;
    }

    .card--privado {
      background: #fdf3e8;
      border-left: 5px solid #f0932b;
    }

    .ficha-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(20, 27, 33, 0.55);
      backdrop-filter: blur(3px);
    }

    .ficha-overlay[hidden] {
      display: none;
    }

    .ficha {
      position: relative;
      width: min(560px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      padding: 26px 28px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 24px 60px rgba(20, 27, 33, 0.35);
    }

    .ficha h2 {
      margin: 0 34px 4px 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .ficha-sub {
      margin: 0 0 18px;
      font-size: 14px;
      color: var(--muted);
    }

    .ficha-close {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #fff;
      font-size: 20px;
      line-height: 1;
      color: var(--ink);
      cursor: pointer;
    }

    .ficha-close:hover {
      background: #f3f5f7;
    }

    .ficha-body {
      display: grid;
      grid-template-columns: minmax(140px, 38%) 1fr;
      gap: 8px 16px;
      margin: 0;
    }

    .ficha-body dt {
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .ficha-body dd {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .ficha-body a {
      color: var(--accent);
    }

    .ficha-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .ficha-action {
      padding: 9px 16px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }

    .ficha-action:hover {
      background: #244b4f;
    }

    .ficha-votos {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .votos-title {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .voto-cat {
      margin-bottom: 16px;
    }

    .voto-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 2px 8px;
    }

    .voto-label {
      font-size: 14px;
      font-weight: 700;
    }

    .voto-legend {
      font-size: 12px;
      color: var(--muted);
    }

    .voto-stars {
      display: inline-flex;
      gap: 2px;
      margin-top: 4px;
    }

    .voto-opciones {
      display: grid;
      gap: 4px;
      margin-top: 6px;
    }

    .voto-opcion {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.1s ease, border-color 0.1s ease;
    }

    .voto-opcion:hover {
      background: #f3f5f7;
    }

    .voto-opcion .op-stars {
      color: #f5b301;
      font-size: 15px;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .voto-opcion.selected {
      border-color: var(--accent);
      background: rgba(47, 93, 98, 0.09);
      font-weight: 700;
    }

    .voto-opcion.selected .op-text::after {
      content: " \2713 tu voto";
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    .star {
      border: 0;
      background: none;
      padding: 0 2px;
      font-size: 24px;
      line-height: 1;
      color: #d0d7dc;
      cursor: pointer;
      transition: color 0.1s ease, transform 0.1s ease;
    }

    .star:hover {
      transform: scale(1.15);
    }

    .star.on {
      color: #f5b301;
    }

    .voto-desc {
      margin: 2px 0 0;
      min-height: 18px;
      font-size: 13px;
      font-style: italic;
      color: var(--muted);
    }

    .voto-media {
      margin: 2px 0 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }

    .voto-enviar {
      margin-top: 6px;
      padding: 10px 22px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .voto-enviar:hover {
      background: #244b4f;
    }

    .voto-enviar:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .voto-confirm {
      margin: 8px 0 0;
      min-height: 16px;
      font-size: 13px;
      font-weight: 700;
      color: #2e7d32;
    }

    .card h2 {
      margin: 0 0 6px;
      font-size: 16px;
      line-height: 1.25;
    }

    .meta {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
    }

    .card-rating {
      margin-top: 4px;
      color: var(--ink);
      font-weight: 700;
    }

    .card-stars {
      color: #f5b301;
      letter-spacing: 1px;
    }

    .card-novotes {
      color: var(--muted);
      font-weight: 400;
      font-style: italic;
    }

    .card-loading {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-weight: 400;
      font-style: italic;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(47, 93, 98, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #map {
      min-height: 70vh;
      height: 70vh;
      width: 100%;
    }

    .leaflet-popup-content {
      font-family: Georgia, "Times New Roman", serif;
    }

    .popup-title {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 700;
    }

    .popup-text {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
    }

    .progress-wrap {
      margin: 0 0 14px;
    }

    .progress-track {
      height: 6px;
      border-radius: 3px;
      background: rgba(47, 93, 98, 0.15);
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent) 0%, #5f9ea0 100%);
      width: 0%;
      transition: width 0.18s ease;
    }

    .progress-fill.indeterminate {
      width: 45% !important;
      animation: progress-slide 1.3s ease-in-out infinite;
    }

    @keyframes progress-slide {
      0%   { transform: translateX(-150%); }
      100% { transform: translateX(280%); }
    }

    .progress-text {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    .map-loading {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      width: min(420px, calc(100% - 32px));
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 12px 30px rgba(31, 41, 51, 0.18);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .map-loading .progress-text {
      margin-top: 6px;
      font-size: 13px;
      color: var(--ink);
    }

    @media (max-width: 860px) {
      .panel {
        border-right: 0;
      }

      #map {
        min-height: 60vh;
        height: 60vh;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="intro-block">
      <p class="eyebrow">Google Sites + OpenStreetMap</p>
      <h1>Colegios de Madrid</h1>
      <p class="intro">
        Vista completa de centros del fichero georreferenciado. El mapa usa OpenStreetMap,
        permite buscar, filtrar y votar cada colegio.
      </p>
      <p id="status" class="status">Preparando mapa...</p>
      <div id="progress-wrap" class="progress-wrap" hidden>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-text" class="progress-text"></p>
      </div>
    </header>
    <section class="filtros">
      <div class="toolbar">
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="Buscar por centro, municipio, codigo o tipo"
          aria-label="Buscar centros"
        >
        <div class="filter-grid">
          <select id="area-select" class="search-input" aria-label="Filtrar por area territorial">
            <option value="">Todas las areas</option>
          </select>
          <select id="municipio-select" class="search-input" aria-label="Filtrar por municipio">
            <option value="">Todos los municipios</option>
          </select>
          <select id="tipo-select" class="search-input" aria-label="Filtrar por tipo de centro">
            <option value="">Todos los tipos</option>
          </select>
          <select id="votos-select" class="search-input" aria-label="Filtrar por numero de votos">
            <option value="0">Cualquier numero de votos</option>
            <option value="1">Con votos (1+)</option>
            <option value="5">5 votos o mas</option>
            <option value="10">10 votos o mas</option>
          </select>
          <select id="valoracion-select" class="search-input" aria-label="Filtrar por valoracion">
            <option value="0">Cualquier valoracion</option>
            <option value="2">2 estrellas o mas</option>
            <option value="3">3 estrellas o mas</option>
            <option value="4">4 estrellas o mas</option>
          </select>
        </div>
        <div class="chips-row">
          <div class="titularidad-chips" role="group" aria-label="Filtrar por titularidad">
            <button type="button" class="chip chip--publico" data-tit="Público">
              <span class="chip-icon">&#127963;</span> Publico
            </button>
            <button type="button" class="chip chip--concertado" data-tit="Privado Concertado">
              <span class="chip-icon">&#129309;</span> Concertado
            </button>
            <button type="button" class="chip chip--privado" data-tit="Privado">
              <span class="chip-icon">&#127970;</span> Privado
            </button>
          </div>
          <button id="tipos-info" type="button" class="info-btn" aria-label="Ver que significa cada tipo de centro">
            <span class="info-icon">&#9432;</span> Tipos de centro
          </button>
          <button id="reset-filters" type="button" class="reset-btn">Limpiar filtros</button>
        </div>
      </div>
    </section>
    <main id="map" aria-label="Mapa de colegios">
      <div id="map-loading" class="map-loading" hidden>
        <div class="progress-track">
          <div id="progress-fill-map" class="progress-fill"></div>
        </div>
        <p id="progress-text-map" class="progress-text">Cargando colegios...</p>
      </div>
    </main>
    <section class="panel">
      <p id="results-meta" class="results-meta"></p>
      <section id="school-list" class="list"></section>
    </section>
  </div>

  <div id="ficha-overlay" class="ficha-overlay" hidden>
    <div class="ficha" role="dialog" aria-modal="true" aria-labelledby="ficha-title">
      <button id="ficha-close" class="ficha-close" type="button" aria-label="Cerrar ficha">&times;</button>
      <h2 id="ficha-title"></h2>
      <p id="ficha-sub" class="ficha-sub"></p>
      <dl id="ficha-body" class="ficha-body"></dl>
      <div id="ficha-votos" class="ficha-votos"></div>
      <div id="ficha-actions" class="ficha-actions"></div>
    </div>
  </div>

  <div id="tipos-overlay" class="ficha-overlay" hidden>
    <div class="ficha" role="dialog" aria-modal="true" aria-labelledby="tipos-title">
      <button id="tipos-close" class="ficha-close" type="button" aria-label="Cerrar">&times;</button>
      <h2 id="tipos-title">Tipos de centro</h2>
      <p class="ficha-sub">Que significan las siglas del tipo de centro.</p>
      <dl id="tipos-body" class="ficha-body"></dl>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script
    src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
    crossorigin=""
  ></script>
  <script>
    const JSON_URL = "./2605-centros-madrid-georef.json";
    // Pega aqui la URL /exec de tu Google Apps Script para votos compartidos.
    // Si se deja vacio, usa el servidor local (server.py) o el navegador.
    const VOTES_ENDPOINT = "https://script.google.com/macros/s/AKfycbysgxQtncUP9UXrqzjBshJKywHreeTX6LKP6SW5rjy--rg1G12uefRCNzKg5ZFChQIL6g/exec";
    const MAP_CENTER = [40.4168, -3.7038];
    const INITIAL_ZOOM = 10;
    const MAX_LIST_RESULTS = 120;

    // Etiquetas legibles y orden de todos los campos del registro para la ficha.
    const FIELD_LABELS = {
      "CENTRO": "Centro",
      "CODIGO CENTRO": "Codigo de centro",
      "TIPO DE CENTRO": "Tipo de centro",
      "TITULARIDAD": "Titularidad",
      "AREA TERRITORIAL": "Area territorial",
      "MUNICIPIO": "Municipio",
      "DISTRITO MUNICIPAL": "Distrito municipal",
      "DOMICILIO": "Domicilio",
      "COD. POSTAL": "Codigo postal",
      "TELEFONO": "Telefono",
      "FAX": "Fax",
      "EMAIL": "Email",
      "EMAIL2": "Email secundario",
      "latitud": "Latitud",
      "longitud": "Longitud",
      "fuente_geo": "Fuente de geolocalizacion",
      "geocoder_score": "Precision geocoder",
      "geocoder_match_address": "Direccion detectada"
    };
    const FIELD_ORDER = Object.keys(FIELD_LABELS);

    // Categorias de votacion con el texto que aparece por cada numero de estrellas.
    const VOTE_CATEGORIES = [
      {
        key: "comedor",
        label: "Comedor",
        legend: "El servicio de comedor y la calidad de las comidas",
        descriptions: {
          1: "No lo lleves ahi ni loco",
          2: "No le llevo, no me convence",
          3: "Le llevo aunque no sea una maravilla",
          4: "Mis hijos van al comedor",
          5: "A mis hijos les gusta el comedor"
        }
      },
      {
        key: "precio",
        label: "Precio",
        legend: "La relacion calidad-precio del centro y sus servicios",
        descriptions: {

    function normalizeText(value) {
      return (value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function parseJsonRows(rows) {
      return rows.map((row) => {
        const school = {
          area: row["AREA TERRITORIAL"] || "",
          codigo: row["CODIGO CENTRO"] || "",
          tipo: row["TIPO DE CENTRO"] || "",
          centro: row["CENTRO"] || "",
          domicilio: row["DOMICILIO"] || "",
          municipio: row["MUNICIPIO"] || "",
          distrito: row["DISTRITO MUNICIPAL"] || "-",
          postal: row["COD. POSTAL"] || "",
          telefono: row["TELEFONO"] || "",
          email: row["EMAIL"] || "",
          titularidad: row["TITULARIDAD"] || "",
          fuenteGeo: row.fuente_geo || "",
          raw: row,
          coords: row.latitud !== "" && row.longitud !== "" && row.latitud != null && row.longitud != null
            ? {
                lat: Number(row.latitud),
                lon: Number(row.longitud)
              }
            : null
        };

        school.searchText = normalizeText([
          school.codigo,
          school.centro,
          school.tipo,
          school.municipio,
          school.distrito,
          school.domicilio,
          school.titularidad
        ].join(" "));

        return school;
      });
    }

    function cardRatingHtml(codigo) {
      if (!votesLoaded) {
        return `<span class="card-loading"><span class="spinner"></span>Cargando votos\u2026</span>`;
      }
      const stats = voteStats(codigo);
      if (!stats.voters) {
        return `<span class="card-novotes">Sin votos aun</span>`;
      }
      const filled = Math.round(stats.avg);
      const stars = "\u2605".repeat(filled) + "\u2606".repeat(5 - filled);
      return `<span class="card-stars">${stars}</span> ${stats.avg.toFixed(1)} · ${stats.voters} ${stats.voters === 1 ? "voto" : "votos"}`;
    }

    function renderList() {
      const visibleSchools = filteredSchools.slice(0, MAX_LIST_RESULTS);
      listNode.innerHTML = visibleSchools.map((school, index) => `
        <article class="card ${cardClass(school.titularidad)}" data-idx="${index}" role="button" tabindex="0">
          <h2>${index + 1}. ${school.centro}</h2>
          <p class="meta">${titularidadBadge(school.titularidad)} ${school.tipo} · ${school.municipio}</p>
          <p class="meta">${school.domicilio}</p>
          <p class="meta">CP ${school.postal} · Tel. ${school.telefono || "Sin telefono"}</p>

        </article>
      `).join("");

      if (!visibleSchools.length) {
        listNode.innerHTML = `
          <article class="card">
            <h2>Sin resultados</h2>
            <p class="meta">Prueba otro termino de busqueda.</p>
          </article>

      resultsMetaNode.textContent = hiddenCount > 0
        ? `Coincidencias: ${filteredSchools.length}. Se muestran las primeras ${visibleSchools.length}.`
        : `Coincidencias: ${filteredSchools.length}.`;

    function updateStatus(text) {

    function showProgress(pct, text) {
      progressWrap.hidden = false;
      progressFill.style.width = pct + "%";
      progressText.textContent = text;
      mapLoading.hidden = false;
      progressFillMap.style.width = pct + "%";
      progressTextMap.textContent = text;
    }

    function hideProgress() {
      progressWrap.hidden = true;
      progressFill.style.width = "0%";
      progressText.textContent = "";
      mapLoading.hidden = true;
      progressFillMap.style.width = "0%";
    }

    function setIndeterminate(on) {
      progressFill.classList.toggle("indeterminate", on);
      progressFillMap.classList.toggle("indeterminate", on);
    }

    function getVisibleGeocodedSchools() {
      return filteredSchools.filter((school) => school.coords);
    }

    function focusMapOnVisibleMarkers() {
      const visible = getVisibleGeocodedSchools();
      if (!visible.length) {
        map.setView(MAP_CENTER, INITIAL_ZOOM);
        return;
      }

      const bounds = L.latLngBounds(visible.map((school) => [school.coords.lat, school.coords.lon]));
      map.fitBounds(bounds.pad(0.18));
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function isEmptyValue(value) {
      return value == null || value === "" || value === "-";
    }

    function hrefForField(key, value) {
      if (key === "EMAIL" || key === "EMAIL2") return `mailto:${value}`;
      if (key === "TELEFONO" || key === "FAX") return `tel:${String(value).replace(/\s+/g, "")}`;
      return null;
    }

    function loadVotes(codigo) {
      try {
        return JSON.parse(localStorage.getItem("voto:" + codigo)) || {};
      } catch (error) {
        return {};
      }
    }

    function saveVote(codigo, key, value) {
      const votes = loadVotes(codigo);
      votes[key] = value;
      try {
        localStorage.setItem("voto:" + codigo, JSON.stringify(votes));
      } catch (error) {
        // Almacenamiento no disponible: el voto no se persiste en el navegador.
      }
    }

    function applyLocalAggregate(codigo, categoria, valor, anterior) {
      communityVotes[codigo] = communityVotes[codigo] || {};
      const agg = communityVotes[codigo][categoria] || { sum: 0, count: 0 };
      if (anterior >= 1 && anterior <= 5 && agg.count > 0) {
        agg.sum += valor - anterior;
      } else {
        agg.sum += valor;
        agg.count += 1;
      }
      agg.sum = Math.max(agg.sum, 0);
      communityVotes[codigo][categoria] = agg;
    }

    async function postVote(codigo, categoria, valor, anterior) {
      // Google Apps Script: envio sin leer respuesta (evita CORS) y media local optimista.
      if (VOTES_ENDPOINT) {
        applyLocalAggregate(codigo, categoria, valor, anterior);
        try {
          await fetch(VOTES_ENDPOINT, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ codigo, categoria, valor, anterior })
          });
        } catch (error) {
          // Envio fallido: el voto queda reflejado localmente hasta recargar.
        }
        return true;
      }

      try {
        const response = await fetch("api/votacion", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ codigo, categoria, valor, anterior })
        });
        if (response.ok) {
          const data = await response.json();
          if (data && data.aggregate) communityVotes[codigo] = data.aggregate;
          return true;
        }
      } catch (error) {
        // Sin servidor de votacion: se conserva solo en el navegador.
      }
      applyLocalAggregate(codigo, categoria, valor, anterior);
      return false;
    }

    function averageText(codigo, categoria) {
      const agg = communityVotes[codigo] && communityVotes[codigo][categoria];
      if (!agg || !agg.count) return "";
      const media = (agg.sum / agg.count).toFixed(1);
      return `Media: ${media} (${agg.count} ${agg.count === 1 ? "voto" : "votos"})`;
    }

    function renderVotos(school) {
      const codigo = school.codigo || (school.raw && school.raw["CODIGO CENTRO"]) || "";
      const votes = loadVotes(codigo);
      fichaVotos.innerHTML = "";

      const heading = document.createElement("h3");
      heading.className = "votos-title";
      heading.textContent = "Tu valoracion";
      fichaVotos.appendChild(heading);

      const seleccion = {};
      const mediaByKey = {};

      for (const cat of VOTE_CATEGORIES) {
        const row = document.createElement("div");
        row.className = "voto-cat";

        const head = document.createElement("div");
        head.className = "voto-head";

        const label = document.createElement("span");
        label.className = "voto-label";
        label.textContent = cat.label;

        const legend = document.createElement("span");
        legend.className = "voto-legend";
        legend.textContent = cat.legend;

        head.appendChild(label);
        head.appendChild(legend);

        const options = document.createElement("div");
        options.className = "voto-opciones";

        const media = document.createElement("p");
        media.className = "voto-media";
        media.textContent = averageText(codigo, cat.key);
        mediaByKey[cat.key] = media;

        // Por defecto marcado a 3 estrellas hasta que el usuario vote.
        const current = Number(votes[cat.key]) || 3;
        seleccion[cat.key] = current;
        const optionEls = [];

        for (let value = 1; value <= 5; value += 1) {
          const option = document.createElement("button");
          option.type = "button";
          option.className = "voto-opcion" + (value === current ? " selected" : "");
          option.dataset.value = value;
          option.setAttribute("aria-label", `${cat.label}: ${value} estrellas - ${cat.descriptions[value]}`);

          const starsSpan = document.createElement("span");
          starsSpan.className = "op-stars";
          starsSpan.textContent = "\u2605".repeat(value) + "\u2606".repeat(5 - value);

          const textSpan = document.createElement("span");
          textSpan.className = "op-text";
          textSpan.textContent = cat.descriptions[value];

          option.appendChild(starsSpan);
          option.appendChild(textSpan);

          // Solo marca la seleccion; el voto se envia con el boton Votar.
          option.addEventListener("click", () => {
            seleccion[cat.key] = value;
            optionEls.forEach((el) => el.classList.toggle("selected", el === option));
          });

          optionEls.push(option);
          options.appendChild(option);
        }

        row.appendChild(head);
        row.appendChild(options);
        row.appendChild(media);
        fichaVotos.appendChild(row);
      }

      const voteBtn = document.createElement("button");
      voteBtn.type = "button";
      voteBtn.className = "voto-enviar";
      voteBtn.textContent = "Votar";

      const confirm = document.createElement("p");
      confirm.className = "voto-confirm";

      voteBtn.addEventListener("click", async () => {
        voteBtn.disabled = true;
        voteBtn.textContent = "Guardando\u2026";
        confirm.textContent = "";
        for (const cat of VOTE_CATEGORIES) {
          const anterior = Number(loadVotes(codigo)[cat.key]) || 0;
          const value = seleccion[cat.key];
          saveVote(codigo, cat.key, value);
          await postVote(codigo, cat.key, value, anterior);
          mediaByKey[cat.key].textContent = averageText(codigo, cat.key);
        }
        voteBtn.disabled = false;
        voteBtn.textContent = "Votar";
        confirm.textContent = "\u00a1Gracias! Tu voto se ha guardado.";
      });

      fichaVotos.appendChild(voteBtn);
      fichaVotos.appendChild(confirm);
    }

    function openFicha(school) {
      const raw = school.raw || {};
      fichaTitle.textContent = school.centro || raw["CENTRO"] || "Centro";
      fichaSub.innerHTML = `${titularidadBadge(school.titularidad)} ${escapeHtml([school.tipo, school.municipio].filter((v) => !isEmptyValue(v)).join(" · "))}`;

      // Muestra todos los campos: primero los conocidos en orden, luego cualquier extra.
      const orderedKeys = [
        ...FIELD_ORDER.filter((key) => key in raw),
        ...Object.keys(raw).filter((key) => !FIELD_ORDER.includes(key))
      ];

      fichaBody.innerHTML = orderedKeys
        .filter((key) => key !== "CENTRO" && !isEmptyValue(raw[key]))
        .map((key) => {
          const label = FIELD_LABELS[key] || key;
          const href = hrefForField(key, raw[key]);
          const value = escapeHtml(raw[key]);
          const rendered = href ? `<a href="${escapeHtml(href)}">${value}</a>` : value;
          return `<dt>${escapeHtml(label)}</dt><dd>${rendered}</dd>`;
        })
        .join("");

      const actions = [];
      if (school.coords) {
        const gmaps = `https://www.google.com/maps/search/?api=1&query=${school.coords.lat},${school.coords.lon}`;
        actions.push(`<a class="ficha-action" href="${gmaps}" target="_blank" rel="noopener">Ver en Google Maps</a>`);
      }
      if (!isEmptyValue(school.email)) {
        actions.push(`<a class="ficha-action" href="mailto:${escapeHtml(school.email)}">Enviar email</a>`);
      }
      fichaActions.innerHTML = actions.join("");

      renderVotos(school);

      fichaOverlay.hidden = false;
      document.body.style.overflow = "hidden";
      if (school.coords) {
        map.setView([school.coords.lat, school.coords.lon], Math.max(map.getZoom(), 15));

    async function renderMarkers(gen, visibleSchools, shouldFit = false) {
      markerLayer.clearLayers();
      const geocoded = visibleSchools.filter((s) => s.coords);
      const total = geocoded.length;

      if (!total) {
        hideProgress();
        if (shouldFit) focusMapOnVisibleMarkers();
        return;
      }

      // Crea los marcadores en bloques (sin bloquear el hilo) y los inserta en masa.
      const markers = [];
      for (let i = 0; i < total; i += CHUNK_SIZE) {
        if (gen !== renderGen) return;

        const chunk = geocoded.slice(i, i + CHUNK_SIZE);
        for (const school of chunk) {
          const tint = colorFor(school.titularidad);
          const marker = L.circleMarker([school.coords.lat, school.coords.lon], {
            radius: 6,
            color: tint.stroke,
            weight: 1.5,
            fillColor: tint.fill,
            fillOpacity: 0.9
          });
          marker.on("click", () => openFicha(school));
          markers.push(marker);
        }

        const done = Math.min(i + CHUNK_SIZE, total);
        const pct = Math.round((done / total) * 100);
        showProgress(pct, `Preparando centros\u2026 ${done} de ${total}`);

        // Cede el hilo al navegador entre trozos
        await new Promise((r) => setTimeout(r, 0));
      }

      if (gen !== renderGen) return;
      markerLayer.addLayers(markers);
      hideProgress();
      if (shouldFit) focusMapOnVisibleMarkers();
    }

      "CAU SU DANZA": "Centro Autorizado Superior de Danza.",
      "CAU SU ARTE DRA": "Centro Autorizado Superior de Arte Dramatico.",
      "CAU ENS. DEP. GM/SUP": "Centro Autorizado de Ensenanzas Deportivas (grado medio y superior).",
      "CAU ENS.DEP.G.M": "Centro Autorizado de Ensenanzas Deportivas de Grado Medio.",
      "CAU ENS.DEP.G.S.": "Centro Autorizado de Ensenanzas Deportivas de Grado Superior.",
      "CAU EL MUS-DANZA": "Centro Autorizado Elemental de Musica y Danza.",
      "CAU PROF MUS-DANZA": "Centro Autorizado Profesional de Musica y Danza.",
      "CAU ELEM-PROF MUS": "Centro Autorizado Elemental y Profesional de Musica.",
      "CAU ELEM-PROF MU DA": "Centro Autorizado Elemental y Profesional de Musica y Danza."
    };

    function voteStats(codigo) {
      const cats = communityVotes[codigo];
      if (!cats) return { voters: 0, avg: 0 };
      let voters = 0;
      let sum = 0;
      let count = 0;
      for (const key in cats) {
        voters = Math.max(voters, Number(cats[key].count) || 0);
        sum += Number(cats[key].sum) || 0;
        count += Number(cats[key].count) || 0;
      }
      return { voters, avg: count ? sum / count : 0 };
    }

    function applyFilter(shouldFit = false) {
      const normalizedQuery = normalizeText(currentQuery);
      const queryTokens = normalizedQuery.split(/\s+/).filter(Boolean);
      const collapsedQuery = normalizedQuery.replace(/\s+/g, "");
      const filtraVotos = currentVotosMin > 0 || currentValoracionMin > 0;

      filteredSchools = schools.filter((school) => {
        if (currentArea && school.area !== currentArea) return false;
        if (currentMunicipio && school.municipio !== currentMunicipio) return false;
        if (currentTipo && school.tipo !== currentTipo) return false;
        if (currentTitularidad && school.titularidad !== currentTitularidad) return false;

        if (filtraVotos) {
          const stats = voteStats(school.codigo);
          if (currentVotosMin > 0 && stats.voters < currentVotosMin) return false;
          if (currentValoracionMin > 0 && stats.avg < currentValoracionMin) return false;
        }

        if (!queryTokens.length) return true;

        const collapsedSearch = school.searchText.replace(/\s+/g, "");
        return queryTokens.every((token) => school.searchText.includes(token) || collapsedSearch.includes(token))
          || collapsedSearch.includes(collapsedQuery);
      });

      renderList();
      renderGen++;
      renderMarkers(renderGen, filteredSchools, shouldFit);
    }

    function fillSelect(selectNode, values, selected) {
      const placeholder = selectNode.options[0];
      selectNode.innerHTML = "";
      selectNode.appendChild(placeholder);
      for (const value of values) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        if (value === selected) option.selected = true;
        selectNode.appendChild(option);
      }
    }

    function populateFilters() {
      const areas = [...new Set(schools.map((s) => s.area).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
      fillSelect(areaNode, areas, currentArea);

      const tipos = [...new Set(schools.map((s) => s.tipo).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
      fillSelect(tipoNode, tipos, currentTipo);

      refreshMunicipios();
    }

    function refreshMunicipios() {
      const municipios = [...new Set(
        schools
          .filter((s) => !currentArea || s.area === currentArea)
          .map((s) => s.municipio)
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "es"));
      if (currentMunicipio && !municipios.includes(currentMunicipio)) currentMunicipio = "";
      fillSelect(municipioNode, municipios, currentMunicipio);
    }

    function buildQueries(school) {
      const district = school.distrito && school.distrito !== "-" ? `, ${school.distrito}` : "";
      const rawAddress = school.domicilio;
      const trimmedAddress = rawAddress.replace(/,?\s*S\/n$/i, "").trim();

      return [
        `${rawAddress}, ${school.postal} ${school.municipio}${district}, Madrid, Espana`,
        `${trimmedAddress}, ${school.postal} ${school.municipio}${district}, Madrid, Espana`,
        `${trimmedAddress}, ${school.municipio}${district}, Madrid, Espana`,
        `${school.centro}, ${trimmedAddress}, ${school.municipio}, Madrid, Espana`
      ].filter((query, index, all) => query && all.indexOf(query) === index);
    }

    async function geocodeQuery(query) {
      const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=es&q=${encodeURIComponent(query)}`;
      const response = await fetch(url, {
        headers: {
          Accept: "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("La peticion de geocodificacion ha fallado");
      }

      const results = await response.json();
      if (!results.length) {
        return null;
      }

      return {
        lat: Number(results[0].lat),
        lon: Number(results[0].lon)
      };
    }

    async function geocodeSchool(school) {
      if (school.coords) {
        return school.coords;
      }

      const queries = buildQueries(school);
      for (const query of queries) {
        const result = await geocodeQuery(query);
        if (result) {
          return result;
        }
      }

      throw new Error(`Sin resultados para ${school.centro}`);
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function attachEvents() {
      searchNode.addEventListener("input", (event) => {
        currentQuery = event.target.value;
        applyFilter(true);
      });

      areaNode.addEventListener("change", (event) => {
        currentArea = event.target.value;
        refreshMunicipios();
        applyFilter(true);
      });

      municipioNode.addEventListener("change", (event) => {
        currentMunicipio = event.target.value;
        applyFilter(true);
      });

      tipoNode.addEventListener("change", (event) => {
        currentTipo = event.target.value;
        applyFilter(true);
      });

      titularidadChips.forEach((chip) => {
        chip.addEventListener("click", () => {
          const value = chip.dataset.tit;
          // Alterna: si ya estaba activo, se deselecciona.
          currentTitularidad = currentTitularidad === value ? "" : value;
          titularidadChips.forEach((c) => c.classList.toggle("active", c.dataset.tit === currentTitularidad));
          applyFilter(true);
        });
      });

      tiposInfoBtn.addEventListener("click", openTiposModal);
      tiposClose.addEventListener("click", () => { tiposOverlay.hidden = true; });
      tiposOverlay.addEventListener("click", (event) => {
        if (event.target === tiposOverlay) tiposOverlay.hidden = true;
      });

      votosNode.addEventListener("change", (event) => {
        currentVotosMin = Number(event.target.value) || 0;
        applyFilter(true);
      });

      valoracionNode.addEventListener("change", (event) => {
        currentValoracionMin = Number(event.target.value) || 0;
        applyFilter(true);
      });

      resetNode.addEventListener("click", () => {
        currentQuery = "";
        currentArea = "";
        currentMunicipio = "";
        currentTipo = "";
        currentTitularidad = "";
        currentVotosMin = 0;
        currentValoracionMin = 0;
        searchNode.value = "";
        votosNode.value = "0";
        valoracionNode.value = "0";
        titularidadChips.forEach((c) => c.classList.remove("active"));
        populateFilters();
        applyFilter(true);
      });

      listNode.addEventListener("click", (event) => {
        const card = event.target.closest(".card[data-idx]");
        if (!card) return;
        const school = filteredSchools[Number(card.dataset.idx)];
        if (school) openFicha(school);
      });

      listNode.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest(".card[data-idx]");
        if (!card) return;
        event.preventDefault();
        const school = filteredSchools[Number(card.dataset.idx)];
        if (school) openFicha(school);
      });

      fichaClose.addEventListener("click", closeFicha);
      fichaOverlay.addEventListener("click", (event) => {
        if (event.target === fichaOverlay) closeFicha();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !fichaOverlay.hidden) closeFicha();
        if (event.key === "Escape" && !tiposOverlay.hidden) tiposOverlay.hidden = true;
      });
    }

    async function loadSchools() {
      const response = await fetch(JSON_URL);
      if (!response.ok) {
        throw new Error("No se pudo cargar el JSON georreferenciado.");
      }

      const contentLength = Number(response.headers.get("Content-Length")) || 0;

      // Sin cuerpo legible: descarga directa sin barra de porcentaje.
      if (!response.body || !response.body.getReader) {
        const rows = await response.json();
        return parseJsonRows(rows);
      }

      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;

      setIndeterminate(!contentLength);
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;

        if (contentLength) {
          const pct = Math.round((received / contentLength) * 100);
          showProgress(pct, `Descargando colegios\u2026 ${pct}%`);
        } else {
          const mb = (received / 1048576).toFixed(1);
          showProgress(0, `Descargando colegios\u2026 ${mb} MB`);
        }
      }
      setIndeterminate(false);

      const blob = new Blob(chunks);
      const text = await blob.text();
      const rows = JSON.parse(text);
      return parseJsonRows(rows);
    }

    async function loadCommunityVotes() {
      const source = VOTES_ENDPOINT || "votacion.json";
      try {
        const response = await fetch(source, { cache: "no-store" });
        if (response.ok) return await response.json();
      } catch (error) {
        // Sin fuente de votos accesible: se empieza vacio.
      }
      return {};
    }

    function refreshCommunityVotes() {
      loadCommunityVotes().then((votes) => {
        communityVotes = votes;
        votesLoaded = true;
        renderList();
        if (currentVotosMin > 0 || currentValoracionMin > 0) applyFilter(false);
      });
    }

    async function init() {
      attachEvents();
      updateStatus("Cargando centros...");
      // El mapa ya es visible; ajustamos su tamano y mostramos la barra de carga encima.
      map.invalidateSize();
      showProgress(0, "Descargando colegios\u2026");

      try {
        schools = await loadSchools();
        setIndeterminate(false);
        filteredSchools = schools.slice();
        populateFilters();
        applyFilter(true);
        const geocodedCount = schools.filter((school) => school.coords).length;
        updateStatus(`Mapa listo. Centros: ${schools.length}. Coordenadas: ${geocodedCount}.`);
        // Los votos compartidos se cargan en segundo plano para no bloquear el mapa.
        refreshCommunityVotes();
      } catch (error) {
        console.error(error);
        hideProgress();
        updateStatus("No se pudo cargar el mapa. Revisa que el JSON publicado este disponible.");
      }
    }

    init();
  </script>
