<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colegios de la Comunidad de Madrid</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    :root {
      --bg: #eef1f4;
      --panel: rgba(255, 255, 255, 0.94);
      --ink: #1f2933;
      --muted: #5b6875;
      --accent: #2f5d62;
      --border: rgba(31, 41, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(47, 93, 98, 0.08), transparent 28%),
        linear-gradient(180deg, #f7f9fb 0%, var(--bg) 100%);
    }

    .layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
    }

    .panel {
      padding: 24px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      backdrop-filter: blur(10px);
      overflow-y: auto;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1;
      font-weight: 700;
    }

    .intro {
      margin: 16px 0 18px;
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
    }

    .status {
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f3f5f7;
      font-size: 14px;
      color: var(--muted);
    }

    .toolbar {
      display: grid;
      gap: 10px;
      margin: 0 0 18px;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      box-shadow: inset 0 1px 2px rgba(31, 41, 51, 0.04);
    }

    .search-input::placeholder {
      color: #75808a;
    }

    .results-meta {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .card {
      padding: 14px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(31, 41, 51, 0.06);
    }

    .card h2 {
      margin: 0 0 6px;
      font-size: 16px;
      line-height: 1.25;
    }

    .meta {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
    }

    #map {
      min-height: 100vh;
      width: 100%;
    }

    .leaflet-popup-content {
      font-family: Georgia, "Times New Roman", serif;
    }

    .popup-title {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 700;
    }

    .popup-text {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
    }

    .progress-wrap {
      margin: 0 0 14px;
    }

    .progress-track {
      height: 6px;
      border-radius: 3px;
      background: rgba(47, 93, 98, 0.15);
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent) 0%, #5f9ea0 100%);
      width: 0%;
      transition: width 0.18s ease;
    }

    .progress-fill.indeterminate {
      width: 45% !important;
      animation: progress-slide 1.3s ease-in-out infinite;
    }

    @keyframes progress-slide {
      0%   { transform: translateX(-150%); }
      100% { transform: translateX(280%); }
    }

    .progress-text {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .panel {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      #map {
        min-height: 62vh;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <p class="eyebrow">Google Sites + OpenStreetMap</p>
      <h1>Colegios de Madrid</h1>
      <p class="intro">
        Vista completa de centros del fichero georreferenciado. El mapa usa OpenStreetMap con base
        gris de CARTO, permite buscar y carga todos los puntos al instante desde un JSON publicado.
      </p>
      <p id="status" class="status">Preparando mapa...</p>
      <div id="progress-wrap" class="progress-wrap" hidden>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-text" class="progress-text"></p>
      </div>
      <div class="toolbar">
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="Buscar por centro, municipio, codigo o tipo"
          aria-label="Buscar centros"
        >
        <p id="results-meta" class="results-meta"></p>
      </div>
      <section id="school-list" class="list"></section>
    </aside>
    <main id="map" aria-label="Mapa de colegios"></main>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const JSON_URL = "./2605-centros-madrid-georef.json";
    const MAP_CENTER = [40.4168, -3.7038];
    const INITIAL_ZOOM = 10;
    const MAX_LIST_RESULTS = 120;

    let schools = [];
    let filteredSchools = [];
    let currentQuery = "";

    const statusNode = document.getElementById("status");
    const listNode = document.getElementById("school-list");
    const searchNode = document.getElementById("search-input");
    const resultsMetaNode = document.getElementById("results-meta");
    const progressWrap = document.getElementById("progress-wrap");
    const progressFill = document.getElementById("progress-fill");
    const progressText = document.getElementById("progress-text");

    const CHUNK_SIZE = 300;
    let renderGen = 0;
    const sharedCanvas = L.canvas({ padding: 0.5 });

    const map = L.map("map", {
      preferCanvas: true,
      zoomControl: true,
      scrollWheelZoom: true
    }).setView(MAP_CENTER, INITIAL_ZOOM);
    const markerLayer = L.layerGroup().addTo(map);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: "abcd",
      maxZoom: 20
    }).addTo(map);

    function normalizeText(value) {
      return (value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function parseJsonRows(rows) {
      return rows.map((row) => {
        const school = {
          area: row["AREA TERRITORIAL"] || "",
          codigo: row["CODIGO CENTRO"] || "",
          tipo: row["TIPO DE CENTRO"] || "",
          centro: row["CENTRO"] || "",
          domicilio: row["DOMICILIO"] || "",
          municipio: row["MUNICIPIO"] || "",
          distrito: row["DISTRITO MUNICIPAL"] || "-",
          postal: row["COD. POSTAL"] || "",
          telefono: row["TELEFONO"] || "",
          email: row["EMAIL"] || "",
          titularidad: row["TITULARIDAD"] || "",
          fuenteGeo: row.fuente_geo || "",
          coords: row.latitud !== "" && row.longitud !== "" && row.latitud != null && row.longitud != null
            ? {
                lat: Number(row.latitud),
                lon: Number(row.longitud)
              }
            : null
        };

        school.searchText = normalizeText([
          school.codigo,
          school.centro,
          school.tipo,
          school.municipio,
          school.distrito,
          school.domicilio,
          school.titularidad
        ].join(" "));

        return school;
      });
    }

    function renderList() {
      const visibleSchools = filteredSchools.slice(0, MAX_LIST_RESULTS);
      listNode.innerHTML = visibleSchools.map((school, index) => `
        <article class="card">
          <h2>${index + 1}. ${school.centro}</h2>
          <p class="meta">${school.tipo} · ${school.municipio}</p>
          <p class="meta">${school.domicilio}</p>
          <p class="meta">CP ${school.postal} · Tel. ${school.telefono || "Sin telefono"}</p>
          <p class="meta">Codigo ${school.codigo} · ${school.titularidad || "Sin dato"}</p>
        </article>
      `).join("");

      if (!visibleSchools.length) {
        listNode.innerHTML = `
          <article class="card">
            <h2>Sin resultados</h2>
            <p class="meta">Prueba otro termino de busqueda.</p>
          </article>
        `;
      }

      const hiddenCount = Math.max(filteredSchools.length - visibleSchools.length, 0);
      resultsMetaNode.textContent = hiddenCount > 0
        ? `Coincidencias: ${filteredSchools.length}. Se muestran las primeras ${visibleSchools.length}.`
        : `Coincidencias: ${filteredSchools.length}.`;
    }

    function updateStatus(text) {
      statusNode.textContent = text;
    }

    function showProgress(pct, text) {
      progressWrap.hidden = false;
      progressFill.style.width = pct + "%";
      progressText.textContent = text;
    }

    function hideProgress() {
      progressWrap.hidden = true;
      progressFill.style.width = "0%";
      progressText.textContent = "";
    }

    function getVisibleGeocodedSchools() {
      return filteredSchools.filter((school) => school.coords);
    }

    function focusMapOnVisibleMarkers() {
      const visible = getVisibleGeocodedSchools();
      if (!visible.length) {
        map.setView(MAP_CENTER, INITIAL_ZOOM);
        return;
      }

      const bounds = L.latLngBounds(visible.map((school) => [school.coords.lat, school.coords.lon]));
      map.fitBounds(bounds.pad(0.18));
    }

    function popupHtml(school) {
      return `
        <div>
          <p class="popup-title">${school.centro}</p>
          <p class="popup-text">${school.tipo} · ${school.titularidad || "Sin dato"}</p>
          <p class="popup-text">${school.domicilio}, ${school.municipio}</p>
          <p class="popup-text">CP ${school.postal} · Tel. ${school.telefono || "Sin telefono"}</p>
          <p class="popup-text">Geo: ${school.fuenteGeo || "sin dato"}</p>
        </div>
      `;
    }

    async function renderMarkers(gen, visibleSchools, shouldFit = false) {
      markerLayer.clearLayers();
      const geocoded = visibleSchools.filter((s) => s.coords);
      const total = geocoded.length;

      if (!total) {
        hideProgress();
        if (shouldFit) focusMapOnVisibleMarkers();
        return;
      }

      for (let i = 0; i < total; i += CHUNK_SIZE) {
        if (gen !== renderGen) return;

        const chunk = geocoded.slice(i, i + CHUNK_SIZE);
        for (const school of chunk) {
          L.circleMarker([school.coords.lat, school.coords.lon], {
            radius: 4,
            color: "#2f5d62",
            weight: 1,
            fillColor: "#5f7f85",
            fillOpacity: 0.78,
            renderer: sharedCanvas
          })
            .bindPopup(popupHtml(school))
            .addTo(markerLayer);
        }

        const done = Math.min(i + CHUNK_SIZE, total);
        const pct = Math.round((done / total) * 100);
        showProgress(pct, `Pintando centros\u2026 ${done} de ${total}`);

        // Cede el hilo al navegador entre trozos
        await new Promise((r) => setTimeout(r, 0));
      }

      if (gen !== renderGen) return;
      hideProgress();
      if (shouldFit) focusMapOnVisibleMarkers();
    }

    function applyFilter(shouldFit = false) {
      const normalizedQuery = normalizeText(currentQuery);
      const queryTokens = normalizedQuery.split(/\s+/).filter(Boolean);
      const collapsedQuery = normalizedQuery.replace(/\s+/g, "");

      filteredSchools = queryTokens.length
        ? schools.filter((school) => {
            const collapsedSearch = school.searchText.replace(/\s+/g, "");
            return queryTokens.every((token) => school.searchText.includes(token) || collapsedSearch.includes(token))
              || collapsedSearch.includes(collapsedQuery);
          })
        : schools.slice();

      renderList();
      renderGen++;
      renderMarkers(renderGen, filteredSchools, shouldFit);
    }

    function buildQueries(school) {
      const district = school.distrito && school.distrito !== "-" ? `, ${school.distrito}` : "";
      const rawAddress = school.domicilio;
      const trimmedAddress = rawAddress.replace(/,?\s*S\/n$/i, "").trim();

      return [
        `${rawAddress}, ${school.postal} ${school.municipio}${district}, Madrid, Espana`,
        `${trimmedAddress}, ${school.postal} ${school.municipio}${district}, Madrid, Espana`,
        `${trimmedAddress}, ${school.municipio}${district}, Madrid, Espana`,
        `${school.centro}, ${trimmedAddress}, ${school.municipio}, Madrid, Espana`
      ].filter((query, index, all) => query && all.indexOf(query) === index);
    }

    async function geocodeQuery(query) {
      const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=es&q=${encodeURIComponent(query)}`;
      const response = await fetch(url, {
        headers: {
          Accept: "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("La peticion de geocodificacion ha fallado");
      }

      const results = await response.json();
      if (!results.length) {
        return null;
      }

      return {
        lat: Number(results[0].lat),
        lon: Number(results[0].lon)
      };
    }

    async function geocodeSchool(school) {
      if (school.coords) {
        return school.coords;
      }

      const queries = buildQueries(school);
      for (const query of queries) {
        const result = await geocodeQuery(query);
        if (result) {
          return result;
        }
      }

      throw new Error(`Sin resultados para ${school.centro}`);
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function attachEvents() {
      searchNode.addEventListener("input", (event) => {
        currentQuery = event.target.value;
        applyFilter(true);
      });
    }

    async function loadSchools() {
      const response = await fetch(JSON_URL);
      if (!response.ok) {
        throw new Error("No se pudo cargar el JSON georreferenciado.");
      }

      const rows = await response.json();
      return parseJsonRows(rows);
    }

    async function init() {
      attachEvents();
      updateStatus("Cargando centros...");
      progressWrap.hidden = false;
      progressFill.classList.add("indeterminate");
      progressText.textContent = "Descargando datos...";

      try {
        schools = await loadSchools();
        progressFill.classList.remove("indeterminate");
        filteredSchools = schools.slice();
        applyFilter(true);
        const geocodedCount = schools.filter((school) => school.coords).length;
        updateStatus(`Mapa listo. Centros: ${schools.length}. Coordenadas: ${geocodedCount}.`);
      } catch (error) {
        console.error(error);
        hideProgress();
        updateStatus("No se pudo cargar el mapa. Revisa que el JSON publicado este disponible.");
      }
    }

    init();
  </script>
</body>
</html>
