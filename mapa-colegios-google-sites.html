<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colegios de la Comunidad de Madrid</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    crossorigin=""
  >
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    crossorigin=""
  >
  <style>
    :root {
      --bg: #eef1f4;
      --panel: rgba(255, 255, 255, 0.94);
      --ink: #1f2933;
      --muted: #5b6875;
      --accent: #2f5d62;
      --border: rgba(31, 41, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(47, 93, 98, 0.08), transparent 28%),
        linear-gradient(180deg, #f7f9fb 0%, var(--bg) 100%);
    }

    .layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr;
    }

    .panel {
      padding: 24px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .intro-block {
      padding: 24px 24px 16px;
      background: var(--panel);
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1;
      font-weight: 700;
    }

    .intro {
      margin: 16px 0 18px;
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
    }

    .status {
      margin: 0 0 18px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f3f5f7;
      font-size: 14px;
      color: var(--muted);
    }

    .toolbar {
      display: grid;
      gap: 10px;
      margin: 0 0 18px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .reset-btn {
      justify-self: start;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--accent);
      font: inherit;
      cursor: pointer;
    }

    .reset-btn:hover {
      background: #f3f5f7;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      box-shadow: inset 0 1px 2px rgba(31, 41, 51, 0.04);
    }

    .search-input::placeholder {
      color: #75808a;
    }

    .results-meta {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .card {
      padding: 14px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(31, 41, 51, 0.06);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(31, 41, 51, 0.14);
      outline: none;
    }

    .ficha-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(20, 27, 33, 0.55);
      backdrop-filter: blur(3px);
    }

    .ficha-overlay[hidden] {
      display: none;
    }

    .ficha {
      position: relative;
      width: min(560px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      padding: 26px 28px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 24px 60px rgba(20, 27, 33, 0.35);
    }

    .ficha h2 {
      margin: 0 34px 4px 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .ficha-sub {
      margin: 0 0 18px;
      font-size: 14px;
      color: var(--muted);
    }

    .ficha-close {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #fff;
      font-size: 20px;
      line-height: 1;
      color: var(--ink);
      cursor: pointer;
    }

    .ficha-close:hover {
      background: #f3f5f7;
    }

    .ficha-body {
      display: grid;
      grid-template-columns: minmax(140px, 38%) 1fr;
      gap: 8px 16px;
      margin: 0;
    }

    .ficha-body dt {
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .ficha-body dd {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .ficha-body a {
      color: var(--accent);
    }

    .ficha-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .ficha-action {
      padding: 9px 16px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }

    .ficha-action:hover {
      background: #244b4f;
    }

    .card h2 {
      margin: 0 0 6px;
      font-size: 16px;
      line-height: 1.25;
    }

    .meta {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
    }

    #map {
      min-height: 70vh;
      height: 70vh;
      width: 100%;
    }

    .leaflet-popup-content {
      font-family: Georgia, "Times New Roman", serif;
    }

    .popup-title {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 700;
    }

    .popup-text {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
    }

    .progress-wrap {
      margin: 0 0 14px;
    }

    .progress-track {
      height: 6px;
      border-radius: 3px;
      background: rgba(47, 93, 98, 0.15);
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent) 0%, #5f9ea0 100%);
      width: 0%;
      transition: width 0.18s ease;
    }

    .progress-fill.indeterminate {
      width: 45% !important;
      animation: progress-slide 1.3s ease-in-out infinite;
    }

    @keyframes progress-slide {
      0%   { transform: translateX(-150%); }
      100% { transform: translateX(280%); }
    }

    .progress-text {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    .map-loading {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      width: min(420px, calc(100% - 32px));
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 12px 30px rgba(31, 41, 51, 0.18);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .map-loading .progress-text {
      margin-top: 6px;
      font-size: 13px;
      color: var(--ink);
    }

    @media (max-width: 860px) {
      .panel {
        border-right: 0;
      }

      #map {
        min-height: 60vh;
        height: 60vh;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="intro-block">
      <p class="eyebrow">Google Sites + OpenStreetMap</p>
      <h1>Colegios de Madrid</h1>
      <p class="intro">
        Vista completa de centros del fichero georreferenciado. El mapa usa OpenStreetMap con base
        gris de CARTO, permite buscar y carga todos los puntos al instante desde un JSON publicado.
      </p>
      <p id="status" class="status">Preparando mapa...</p>
      <div id="progress-wrap" class="progress-wrap" hidden>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-text" class="progress-text"></p>
      </div>
    </header>
    <main id="map" aria-label="Mapa de colegios">
      <div id="map-loading" class="map-loading" hidden>
        <div class="progress-track">
          <div id="progress-fill-map" class="progress-fill"></div>
        </div>
        <p id="progress-text-map" class="progress-text">Cargando colegios...</p>
      </div>
    </main>
    <section class="panel">
      <div class="toolbar">
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="Buscar por centro, municipio, codigo o tipo"
          aria-label="Buscar centros"
        >
        <div class="filter-grid">
          <select id="area-select" class="search-input" aria-label="Filtrar por area territorial">
            <option value="">Todas las areas</option>
          </select>
          <select id="municipio-select" class="search-input" aria-label="Filtrar por municipio">
            <option value="">Todos los municipios</option>
          </select>
          <select id="tipo-select" class="search-input" aria-label="Filtrar por tipo de centro">
            <option value="">Todos los tipos</option>
          </select>
          <select id="titularidad-select" class="search-input" aria-label="Filtrar por titularidad">
            <option value="">Todas las titularidades</option>
          </select>
        </div>
        <button id="reset-filters" type="button" class="reset-btn">Limpiar filtros</button>
        <p id="results-meta" class="results-meta"></p>
      </div>
      <section id="school-list" class="list"></section>
    </section>
  </div>

  <div id="ficha-overlay" class="ficha-overlay" hidden>
    <div class="ficha" role="dialog" aria-modal="true" aria-labelledby="ficha-title">
      <button id="ficha-close" class="ficha-close" type="button" aria-label="Cerrar ficha">&times;</button>
      <h2 id="ficha-title"></h2>
      <p id="ficha-sub" class="ficha-sub"></p>
      <dl id="ficha-body" class="ficha-body"></dl>
      <div id="ficha-actions" class="ficha-actions"></div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script
    src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
    crossorigin=""
  ></script>
  <script>
    const JSON_URL = "./2605-centros-madrid-georef.json";
    const MAP_CENTER = [40.4168, -3.7038];
    const INITIAL_ZOOM = 10;
    const MAX_LIST_RESULTS = 120;

    let schools = [];
    let filteredSchools = [];
    let currentQuery = "";
    let currentArea = "";
    let currentMunicipio = "";
    let currentTipo = "";
    let currentTitularidad = "";

    const statusNode = document.getElementById("status");
    const listNode = document.getElementById("school-list");
    const searchNode = document.getElementById("search-input");
    const areaNode = document.getElementById("area-select");
    const municipioNode = document.getElementById("municipio-select");
    const tipoNode = document.getElementById("tipo-select");
    const titularidadNode = document.getElementById("titularidad-select");
    const resetNode = document.getElementById("reset-filters");
    const resultsMetaNode = document.getElementById("results-meta");
    const fichaOverlay = document.getElementById("ficha-overlay");
    const fichaTitle = document.getElementById("ficha-title");
    const fichaSub = document.getElementById("ficha-sub");
    const fichaBody = document.getElementById("ficha-body");
    const fichaActions = document.getElementById("ficha-actions");
    const fichaClose = document.getElementById("ficha-close");
    const progressWrap = document.getElementById("progress-wrap");
    const progressFill = document.getElementById("progress-fill");
    const progressText = document.getElementById("progress-text");
    const mapLoading = document.getElementById("map-loading");
    const progressFillMap = document.getElementById("progress-fill-map");
    const progressTextMap = document.getElementById("progress-text-map");

    const CHUNK_SIZE = 300;
    let renderGen = 0;

    const map = L.map("map", {
      preferCanvas: true,
      zoomControl: true,
      scrollWheelZoom: true,
      maxZoom: 19
    }).setView(MAP_CENTER, INITIAL_ZOOM);

    // Agrupa por zonas y muestra mas detalle al hacer zoom.
    const markerLayer = L.markerClusterGroup({
      chunkedLoading: true,
      chunkInterval: 100,
      chunkDelay: 0,
      maxClusterRadius: 60,
      spiderfyOnMaxZoom: true,
      disableClusteringAtZoom: 17,
      removeOutsideVisibleBounds: true
    }).addTo(map);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      subdomains: "abc",
      maxZoom: 19
    }).addTo(map);

    function normalizeText(value) {
      return (value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function parseJsonRows(rows) {
      return rows.map((row) => {
        const school = {
          area: row["AREA TERRITORIAL"] || "",
          codigo: row["CODIGO CENTRO"] || "",
          tipo: row["TIPO DE CENTRO"] || "",
          centro: row["CENTRO"] || "",
          domicilio: row["DOMICILIO"] || "",
          municipio: row["MUNICIPIO"] || "",
          distrito: row["DISTRITO MUNICIPAL"] || "-",
          postal: row["COD. POSTAL"] || "",
          telefono: row["TELEFONO"] || "",
          email: row["EMAIL"] || "",
          titularidad: row["TITULARIDAD"] || "",
          fuenteGeo: row.fuente_geo || "",
          raw: row,
          coords: row.latitud !== "" && row.longitud !== "" && row.latitud != null && row.longitud != null
            ? {
                lat: Number(row.latitud),
                lon: Number(row.longitud)
              }
            : null
        };

        school.searchText = normalizeText([
          school.codigo,
          school.centro,
          school.tipo,
          school.municipio,
          school.distrito,
          school.domicilio,
          school.titularidad
        ].join(" "));

        return school;
      });
    }

    function renderList() {
      const visibleSchools = filteredSchools.slice(0, MAX_LIST_RESULTS);
      listNode.innerHTML = visibleSchools.map((school, index) => `
        <article class="card" data-idx="${index}" role="button" tabindex="0">
          <h2>${index + 1}. ${school.centro}</h2>
          <p class="meta">${school.tipo} · ${school.municipio}</p>
          <p class="meta">${school.domicilio}</p>
          <p class="meta">CP ${school.postal} · Tel. ${school.telefono || "Sin telefono"}</p>
          <p class="meta">Codigo ${school.codigo} · ${school.titularidad || "Sin dato"}</p>
        </article>
      `).join("");

      if (!visibleSchools.length) {
        listNode.innerHTML = `
          <article class="card">
            <h2>Sin resultados</h2>
            <p class="meta">Prueba otro termino de busqueda.</p>
          </article>
        `;
      }

      const hiddenCount = Math.max(filteredSchools.length - visibleSchools.length, 0);
      resultsMetaNode.textContent = hiddenCount > 0
        ? `Coincidencias: ${filteredSchools.length}. Se muestran las primeras ${visibleSchools.length}.`
        : `Coincidencias: ${filteredSchools.length}.`;
    }

    function updateStatus(text) {
      statusNode.textContent = text;
    }

    function showProgress(pct, text) {
      progressWrap.hidden = false;
      progressFill.style.width = pct + "%";
      progressText.textContent = text;
      mapLoading.hidden = false;
      progressFillMap.style.width = pct + "%";
      progressTextMap.textContent = text;
    }

    function hideProgress() {
      progressWrap.hidden = true;
      progressFill.style.width = "0%";
      progressText.textContent = "";
      mapLoading.hidden = true;
      progressFillMap.style.width = "0%";
    }

    function setIndeterminate(on) {
      progressFill.classList.toggle("indeterminate", on);
      progressFillMap.classList.toggle("indeterminate", on);
    }

    function getVisibleGeocodedSchools() {
      return filteredSchools.filter((school) => school.coords);
    }

    function focusMapOnVisibleMarkers() {
      const visible = getVisibleGeocodedSchools();
      if (!visible.length) {
        map.setView(MAP_CENTER, INITIAL_ZOOM);
        return;
      }

      const bounds = L.latLngBounds(visible.map((school) => [school.coords.lat, school.coords.lon]));
      map.fitBounds(bounds.pad(0.18));
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function isEmptyValue(value) {
      return value == null || value === "" || value === "-";
    }

    function openFicha(school) {
      const raw = school.raw || {};
      fichaTitle.textContent = school.centro || "Centro";
      fichaSub.textContent = [school.tipo, school.titularidad, school.municipio]
        .filter((v) => !isEmptyValue(v))
        .join(" · ");

      const rows = [
        ["Codigo de centro", school.codigo],
        ["Tipo de centro", school.tipo],
        ["Titularidad", school.titularidad],
        ["Area territorial", school.area],
        ["Municipio", school.municipio],
        ["Distrito municipal", school.distrito],
        ["Domicilio", school.domicilio],
        ["Codigo postal", school.postal],
        ["Telefono", school.telefono, school.telefono ? `tel:${String(school.telefono).replace(/\s+/g, "")}` : null],
        ["Fax", raw["FAX"]],
        ["Email", school.email, school.email ? `mailto:${school.email}` : null],
        ["Email 2", raw["EMAIL2"], raw["EMAIL2"] && !isEmptyValue(raw["EMAIL2"]) ? `mailto:${raw["EMAIL2"]}` : null],
        ["Coordenadas", school.coords ? `${school.coords.lat.toFixed(6)}, ${school.coords.lon.toFixed(6)}` : ""],
        ["Fuente de geolocalizacion", school.fuenteGeo],
        ["Precision geocoder", raw["geocoder_score"]],
        ["Direccion detectada", raw["geocoder_match_address"]]
      ];

      fichaBody.innerHTML = rows
        .filter(([, value]) => !isEmptyValue(value))
        .map(([label, value, href]) => {
          const safeValue = escapeHtml(value);
          const rendered = href
            ? `<a href="${escapeHtml(href)}">${safeValue}</a>`
            : safeValue;
          return `<dt>${escapeHtml(label)}</dt><dd>${rendered}</dd>`;
        })
        .join("");

      const actions = [];
      if (school.coords) {
        const gmaps = `https://www.google.com/maps/search/?api=1&query=${school.coords.lat},${school.coords.lon}`;
        actions.push(`<a class="ficha-action" href="${gmaps}" target="_blank" rel="noopener">Ver en Google Maps</a>`);
      }
      if (!isEmptyValue(school.email)) {
        actions.push(`<a class="ficha-action" href="mailto:${escapeHtml(school.email)}">Enviar email</a>`);
      }
      fichaActions.innerHTML = actions.join("");

      fichaOverlay.hidden = false;
      document.body.style.overflow = "hidden";
      if (school.coords) {
        map.setView([school.coords.lat, school.coords.lon], Math.max(map.getZoom(), 15));
      }
    }

    function closeFicha() {
      fichaOverlay.hidden = true;
      document.body.style.overflow = "";
    }

    async function renderMarkers(gen, visibleSchools, shouldFit = false) {
      markerLayer.clearLayers();
      const geocoded = visibleSchools.filter((s) => s.coords);
      const total = geocoded.length;

      if (!total) {
        hideProgress();
        if (shouldFit) focusMapOnVisibleMarkers();
        return;
      }

      // Crea los marcadores en bloques (sin bloquear el hilo) y los inserta en masa.
      const markers = [];
      for (let i = 0; i < total; i += CHUNK_SIZE) {
        if (gen !== renderGen) return;

        const chunk = geocoded.slice(i, i + CHUNK_SIZE);
        for (const school of chunk) {
          const marker = L.circleMarker([school.coords.lat, school.coords.lon], {
            radius: 4,
            color: "#2f5d62",
            weight: 1,
            fillColor: "#5f7f85",
            fillOpacity: 0.78
          });
          marker.on("click", () => openFicha(school));
          markers.push(marker);
        }

        const done = Math.min(i + CHUNK_SIZE, total);
        const pct = Math.round((done / total) * 100);
        showProgress(pct, `Preparando centros\u2026 ${done} de ${total}`);

        // Cede el hilo al navegador entre trozos
        await new Promise((r) => setTimeout(r, 0));
      }

      if (gen !== renderGen) return;
      markerLayer.addLayers(markers);
      hideProgress();
      if (shouldFit) focusMapOnVisibleMarkers();
    }

    function applyFilter(shouldFit = false) {
      const normalizedQuery = normalizeText(currentQuery);
      const queryTokens = normalizedQuery.split(/\s+/).filter(Boolean);
      const collapsedQuery = normalizedQuery.replace(/\s+/g, "");

      filteredSchools = schools.filter((school) => {
        if (currentArea && school.area !== currentArea) return false;
        if (currentMunicipio && school.municipio !== currentMunicipio) return false;
        if (currentTipo && school.tipo !== currentTipo) return false;
        if (currentTitularidad && school.titularidad !== currentTitularidad) return false;
        if (!queryTokens.length) return true;

        const collapsedSearch = school.searchText.replace(/\s+/g, "");
        return queryTokens.every((token) => school.searchText.includes(token) || collapsedSearch.includes(token))
          || collapsedSearch.includes(collapsedQuery);
      });

      renderList();
      renderGen++;
      renderMarkers(renderGen, filteredSchools, shouldFit);
    }

    function fillSelect(selectNode, values, selected) {
      const placeholder = selectNode.options[0];
      selectNode.innerHTML = "";
      selectNode.appendChild(placeholder);
      for (const value of values) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        if (value === selected) option.selected = true;
        selectNode.appendChild(option);
      }
    }

    function populateFilters() {
      const areas = [...new Set(schools.map((s) => s.area).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
      fillSelect(areaNode, areas, currentArea);

      const tipos = [...new Set(schools.map((s) => s.tipo).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
      fillSelect(tipoNode, tipos, currentTipo);

      const titularidades = [...new Set(schools.map((s) => s.titularidad).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
      fillSelect(titularidadNode, titularidades, currentTitularidad);

      refreshMunicipios();
    }

    function refreshMunicipios() {
      const municipios = [...new Set(
        schools
          .filter((s) => !currentArea || s.area === currentArea)
          .map((s) => s.municipio)
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "es"));
      if (currentMunicipio && !municipios.includes(currentMunicipio)) currentMunicipio = "";
      fillSelect(municipioNode, municipios, currentMunicipio);
    }

    function buildQueries(school) {
      const district = school.distrito && school.distrito !== "-" ? `, ${school.distrito}` : "";
      const rawAddress = school.domicilio;
      const trimmedAddress = rawAddress.replace(/,?\s*S\/n$/i, "").trim();

      return [
        `${rawAddress}, ${school.postal} ${school.municipio}${district}, Madrid, Espana`,
        `${trimmedAddress}, ${school.postal} ${school.municipio}${district}, Madrid, Espana`,
        `${trimmedAddress}, ${school.municipio}${district}, Madrid, Espana`,
        `${school.centro}, ${trimmedAddress}, ${school.municipio}, Madrid, Espana`
      ].filter((query, index, all) => query && all.indexOf(query) === index);
    }

    async function geocodeQuery(query) {
      const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=es&q=${encodeURIComponent(query)}`;
      const response = await fetch(url, {
        headers: {
          Accept: "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("La peticion de geocodificacion ha fallado");
      }

      const results = await response.json();
      if (!results.length) {
        return null;
      }

      return {
        lat: Number(results[0].lat),
        lon: Number(results[0].lon)
      };
    }

    async function geocodeSchool(school) {
      if (school.coords) {
        return school.coords;
      }

      const queries = buildQueries(school);
      for (const query of queries) {
        const result = await geocodeQuery(query);
        if (result) {
          return result;
        }
      }

      throw new Error(`Sin resultados para ${school.centro}`);
    }

    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function attachEvents() {
      searchNode.addEventListener("input", (event) => {
        currentQuery = event.target.value;
        applyFilter(true);
      });

      areaNode.addEventListener("change", (event) => {
        currentArea = event.target.value;
        refreshMunicipios();
        applyFilter(true);
      });

      municipioNode.addEventListener("change", (event) => {
        currentMunicipio = event.target.value;
        applyFilter(true);
      });

      tipoNode.addEventListener("change", (event) => {
        currentTipo = event.target.value;
        applyFilter(true);
      });

      titularidadNode.addEventListener("change", (event) => {
        currentTitularidad = event.target.value;
        applyFilter(true);
      });

      resetNode.addEventListener("click", () => {
        currentQuery = "";
        currentArea = "";
        currentMunicipio = "";
        currentTipo = "";
        currentTitularidad = "";
        searchNode.value = "";
        populateFilters();
        applyFilter(true);
      });

      listNode.addEventListener("click", (event) => {
        const card = event.target.closest(".card[data-idx]");
        if (!card) return;
        const school = filteredSchools[Number(card.dataset.idx)];
        if (school) openFicha(school);
      });

      listNode.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        const card = event.target.closest(".card[data-idx]");
        if (!card) return;
        event.preventDefault();
        const school = filteredSchools[Number(card.dataset.idx)];
        if (school) openFicha(school);
      });

      fichaClose.addEventListener("click", closeFicha);
      fichaOverlay.addEventListener("click", (event) => {
        if (event.target === fichaOverlay) closeFicha();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !fichaOverlay.hidden) closeFicha();
      });
    }

    async function loadSchools() {
      const response = await fetch(JSON_URL);
      if (!response.ok) {
        throw new Error("No se pudo cargar el JSON georreferenciado.");
      }

      const contentLength = Number(response.headers.get("Content-Length")) || 0;

      // Sin cuerpo legible: descarga directa sin barra de porcentaje.
      if (!response.body || !response.body.getReader) {
        const rows = await response.json();
        return parseJsonRows(rows);
      }

      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;

      setIndeterminate(!contentLength);
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;

        if (contentLength) {
          const pct = Math.round((received / contentLength) * 100);
          showProgress(pct, `Descargando colegios\u2026 ${pct}%`);
        } else {
          const mb = (received / 1048576).toFixed(1);
          showProgress(0, `Descargando colegios\u2026 ${mb} MB`);
        }
      }
      setIndeterminate(false);

      const blob = new Blob(chunks);
      const text = await blob.text();
      const rows = JSON.parse(text);
      return parseJsonRows(rows);
    }

    async function init() {
      attachEvents();
      updateStatus("Cargando centros...");
      // El mapa ya es visible; ajustamos su tamano y mostramos la barra de carga encima.
      map.invalidateSize();
      showProgress(0, "Descargando colegios\u2026");

      try {
        schools = await loadSchools();
        setIndeterminate(false);
        filteredSchools = schools.slice();
        populateFilters();
        applyFilter(true);
        const geocodedCount = schools.filter((school) => school.coords).length;
        updateStatus(`Mapa listo. Centros: ${schools.length}. Coordenadas: ${geocodedCount}.`);
      } catch (error) {
        console.error(error);
        hideProgress();
        updateStatus("No se pudo cargar el mapa. Revisa que el JSON publicado este disponible.");
      }
    }

    init();
  </script>
